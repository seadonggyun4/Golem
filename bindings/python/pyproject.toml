[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golem-runtime"
version = "0.1.0"
description = "Typed Python binding for the Golem C validation and replay engine"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golem_runtime = ["py.typed"]
