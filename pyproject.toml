[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golem-awe"
version = "0.1.0"
description = "Golem headless Agentic Work Engine runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
golem = "golem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
