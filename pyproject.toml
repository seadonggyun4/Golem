[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "golem-awe"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL-LICENSE.md"]
version = "0.1.0"
description = "Golem headless Agentic Work Engine runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
golem = "golem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
