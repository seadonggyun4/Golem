name: Correct strict Unicode json-c
description: Install checksum-pinned upstream json-c without changing runner system packages
runs:
  using: composite
  steps:
    - name: Build json-c 0.19 in a private runner prefix
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/golem-json-c-0.19"
        mkdir -p "$root"
        curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
          https://s3.amazonaws.com/json-c_releases/releases/json-c-0.19-nodoc.tar.gz \
          --output "$root/source.tar.gz"
        printf '%s  %s\n' \
          704927172443309a8efeb162060bb215548e1286e5568514007dd2cc35a0a164 \
          "$root/source.tar.gz" | sha256sum --check --strict
        mkdir -p "$root/source"
        tar -xzf "$root/source.tar.gz" -C "$root/source" --strip-components=1
        cmake -S "$root/source" -B "$root/build" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$root/install" \
          -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=OFF -DBUILD_APPS=OFF
        cmake --build "$root/build" --parallel 2
        cmake --install "$root/build"
        printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig:%s\n' "$root/install" "${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
        printf 'LD_LIBRARY_PATH=%s/lib:%s\n' "$root/install" "${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
