# Reusable only: automatic execution is selected by c.yml.
name: "Conan contract"
'on':
  workflow_call:
    inputs:
      full:
        type: "boolean"
        default: false
permissions:
  contents: "read"
jobs:
  package:
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJSON(inputs.full && '[{\"os\":\"ubuntu-latest\",\"cli\":\"True\"},{\"os\":\"ubuntu-latest\",\"cli\":\"False\"},{\"os\":\"macos-latest\",\"cli\":\"True\"},{\"os\":\"macos-latest\",\"cli\":\"False\"}]' || '[{\"os\":\"ubuntu-latest\",\"cli\":\"True\"},{\"os\":\"ubuntu-latest\",\"cli\":\"False\"}]') }}"
    steps:
      - uses: "actions/checkout@v4"
        with:
          persist-credentials: false
      - name: "Isolate Conan cache"
        run: "echo \"CONAN_HOME=$RUNNER_TEMP/golem-conan\" >> \"$GITHUB_ENV\""
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - run: "python -m pip install conan==2.32.0"
      - if: "runner.os == 'Linux'"
        run: "sudo apt-get update && sudo apt-get install -y cmake pkg-config"
      - if: "runner.os == 'macOS'"
        run: "brew install cmake pkg-config"
      - run: "conan profile detect"
      - run: "conan create . --build=missing -o 'golem/*:with_cli=${{ matrix.cli }}' -c tools.build:jobs=4"
      - if: "matrix.cli == 'True'"
        run: "python tools/install_conan_cli.py --prefix \"${{ runner.temp }}/golem-install\" --bin-dir \"${{ runner.temp }}/golem-bin\""
      - if: "matrix.cli == 'True'"
        run: "python tests/c/cli_integration.py \"${{ runner.temp }}/golem-bin/golem\" \"${{ runner.temp }}\""
